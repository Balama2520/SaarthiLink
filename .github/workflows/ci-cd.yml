name: Buddy AI CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
    - name: Run Tests
      working-directory: backend
      run: |
        pytest tests/

  frontend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
    - name: Install dependencies
      working-directory: frontend
      run: npm ci
    - name: Run Tests
      working-directory: frontend
      run: npm test

  build-push-containers:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
    - uses: actions/checkout@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    - name: Build Backend
      run: docker build -t buddy-backend:latest -f backend/Dockerfile.prod backend/
    - name: Build Frontend
      run: docker build -t buddy-frontend:latest -f frontend/Dockerfile.prod frontend/
    # - name: Push to Registry (Placeholder)
    #   run: |
    #     docker login ...
    #     docker push ...
