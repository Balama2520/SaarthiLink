name: Saarthi Stack Keep-Alive Warm-Up

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping-services:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Execute Keep-Alive Ping
        env:
          RENDER_URL: "https://saarthilink.onrender.com/"
          HF_URL: "https://huggingface.co/spaces/Balamaneesh2520/saarthi-ai-brain"
          SUPABASE_URL: "https://wcawcytqhpyvtuwnbqlv.supabase.co"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node keep-alive.js
